[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stylegan2-sobieszek"
version = "0.1.0"
description = "Accelerated StyleGAN2 synthesis with shared convolutions, polyphase resampling and Apple Metal kernels"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.txt"}
authors = [{name = "Adam Sobieszek"}]
dependencies = ["torch>=2.8", "numpy", "scipy", "requests", "ninja", "setuptools>=68"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/AdamSobieszek/stylegan2-sobieszek"
Upstream = "https://github.com/NVlabs/stylegan3"

[tool.setuptools]
packages = ["stylegan2_sobieszek", "stylegan2_sobieszek.dnnlib", "stylegan2_sobieszek.op", "stylegan2_sobieszek.torch_utils", "stylegan2_sobieszek.torch_utils.ops", "stylegan2_sobieszek.torch_utils.ops.mps"]
package-dir = {"stylegan2_sobieszek" = "."}
include-package-data = false
license-files = ["LICENSE.txt", "LICENSES/*.txt"]

[tool.setuptools.package-data]
"stylegan2_sobieszek.op" = ["*.cpp", "*.cu", "*.h"]
"stylegan2_sobieszek.torch_utils.ops" = ["*.cpp", "*.cu", "*.h"]
"stylegan2_sobieszek.torch_utils.ops.mps" = ["*.mm", "*.metal", "*.h"]
